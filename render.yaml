# AquaSense backend — Render blueprint.
# Deploy: Render dashboard → New → Blueprint → select this repository.
# Env vars marked "sync: false" are prompted in the dashboard after the
# blueprint is created (paste them as secret environment variables).

services:
  - type: web
    name: aquasense-api
    runtime: python
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        # Pin to your Vercel URL once known, e.g. https://your-app.vercel.app
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
